# Every push and pull request: lint, formatting, unit tests, the build (which validates the
# data and type-checks first), the JavaScript budget, and the browser tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build (validates the data and type-checks first)
        run: npm run build
      - name: JavaScript budget
        run: npm run size
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Keep the browser tests' screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
